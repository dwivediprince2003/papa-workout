plugins { id 'com.android.application' }

android {
    namespace 'com.dwivediprince.workoutcompanion'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dwivediprince.workoutcompanion'
        minSdk 24
        targetSdk 34
        // Bumped automatically by the cloud build (run number)
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '2.0'
    }

    signingConfigs {
        release {
            // Keystore comes from a GitHub secret at build time (never stored in the repo)
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'missing.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'workout'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
