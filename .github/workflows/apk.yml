name: Build Android APK

# Runs only when the Android app itself changes (or by hand).
# Plan/exercise changes in plan.json do NOT need a new APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]

permissions:
  contents: write
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Point the app at this repo's GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the real Pages address (handles custom domains); force https
          URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url | sed 's#^http://#https://#')
          sed -i "s#https://example.github.io/workout-companion/#${URL}#" android/app/src/main/res/values/strings.xml
          echo "App URL: $URL"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk WorkoutCompanion.apk

      # Second app for sharing: separate package, opens the web app in "join" mode (asks the user's name)
      - name: Build shareable APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          APP_ID_SUFFIX: .share
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i -E 's#(<string name="app_url">)([^<]*)(</string>)#\1\2?join\3#' "$F"
          sed -i 's#<string name="app_name">Workout</string>#<string name="app_name">Workout Companion</string>#' "$F"
          grep -E 'app_url|app_name' "$F"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk WorkoutCompanionShare.apk

      - name: Publish APK (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk WorkoutCompanion.apk WorkoutCompanionShare.apk --title "Workout Companion (Android)" \
            --notes "WorkoutCompanion.apk is the personal build. WorkoutCompanionShare.apk is the shareable build that asks each user for their name. Plan and content updates load automatically from the web app — no reinstall needed."
