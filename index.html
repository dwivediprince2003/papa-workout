<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Companion</title>
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens: dark "beast" theme — near-black, volt accent, neon day colours ===== */
:root{
  --bg:#0A0C11; --card:#14171E; --card2:#1B1F28; --ink:#F5F6F8; --muted:#A0A6B2; --faint:#666C7A; --line:#262B36; --soft:#1F242E;
  --volt:#C8FF2E; --volt2:#9BE000; --onvolt:#0A0C11; --heat:#FF5A1F;
  --ok:var(--volt); --okbg:rgba(200,255,46,.08); --accent:var(--volt); --onaccent:var(--onvolt);
  --r:24px; --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.35);
  --disp:"Barlow Condensed",Inter,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4;min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(104px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 100% -10%,rgba(200,255,46,.07),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .12s ease}
button:active{transform:scale(.96)}
svg{display:block;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.04s}.rise>*:nth-child(3){animation-delay:.08s}.rise>*:nth-child(4){animation-delay:.12s}
.rise>*:nth-child(5){animation-delay:.16s}.rise>*:nth-child(6){animation-delay:.2s}.rise>*:nth-child(n+7){animation-delay:.24s}

/* header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 0 4px}
.hd .date{font-size:13px;font-weight:700;color:var(--volt);text-transform:uppercase;letter-spacing:1.4px}
.hd h1{margin:2px 0 0;font-family:var(--disp);font-size:44px;font-weight:800;font-style:italic;letter-spacing:-.5px;line-height:1;text-transform:uppercase}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}

/* days strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 0}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 10px;border-radius:16px;min-width:0;background:var(--card);border:1px solid var(--line)}
.day .d{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.day .n{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1}
.day .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor}
.day.sel{background:var(--volt);border-color:var(--volt);color:var(--onvolt);box-shadow:0 8px 24px rgba(200,255,46,.25)}
.day.sel .d{color:rgba(10,12,17,.65)}
.day.sel .dot{background:var(--onvolt)!important;box-shadow:none}
.day.today:not(.sel) .d{color:var(--volt)}

/* hero */
.hero{--c:#FF5A1F;border-radius:28px;padding:22px 20px 20px;color:#fff;margin-top:16px;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#fff 0%) 0%,color-mix(in srgb,var(--c) 55%,#0A0C11) 55%,#0E1016 100%);
  box-shadow:0 20px 50px -18px color-mix(in srgb,var(--c) 70%,transparent)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;
  background:repeating-linear-gradient(-55deg,#fff 0 2px,transparent 2px 14px);mask-image:linear-gradient(200deg,#000,transparent 55%);-webkit-mask-image:linear-gradient(200deg,#000,transparent 55%)}
.hero .lbl{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;opacity:.9;display:inline-flex;align-items:center;gap:8px}
.hero .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.hero h2{margin:8px 0 0;font-family:var(--disp);font-size:58px;font-weight:800;font-style:italic;letter-spacing:-1px;line-height:.92;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.hero .stats{display:flex;gap:10px;margin-top:14px}
.hero .stats span{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:12px}
.hero .note{margin-top:12px;font-size:17px;position:relative;z-index:1}
.bar{height:8px;background:rgba(0,0,0,.35);border-radius:8px;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--volt);border-radius:8px;box-shadow:0 0 12px var(--volt)}
.start{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;background:var(--volt);color:var(--onvolt);
  font-family:var(--disp);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.5px;text-transform:uppercase;padding:16px;border-radius:18px;position:relative;z-index:1;
  box-shadow:0 10px 30px -8px rgba(200,255,46,.6)}

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 12px;gap:10px}
.sec h3{margin:0;font-family:var(--disp);font-size:26px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.2px;line-height:1.05}
.sec small{font-size:13px;color:var(--volt);font-weight:700;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}

/* warm-up chips (horizontal) */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wcard{flex:none;width:136px;scroll-snap-align:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.wcard .th{height:84px;background:#F2F3F5 center/contain no-repeat}
.wcard .nm{padding:10px 11px 12px;font-size:15px;font-weight:700;line-height:1.2}
.wcard .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--volt);display:none;place-items:center}
.wcard.done{border-color:var(--volt)}
.wcard.done .tick{display:grid}

/* exercise rows */
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:10px}
.row .th{width:78px;height:78px;border-radius:14px;flex:none;background:#F2F3F5 center/contain no-repeat;position:relative}
.row .num{position:absolute;left:-4px;top:-4px;width:28px;height:28px;border-radius:10px;background:var(--volt);color:var(--onvolt);font-family:var(--disp);font-size:18px;font-weight:800;font-style:italic;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.row .bd{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:18px;line-height:1.2}
.row .meta{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:15px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:6px;border-radius:4px;background:var(--line)}
.dots i.w{background:transparent;border:1.5px dashed var(--faint);height:6px}
.dots i.on{background:var(--volt);border-color:var(--volt);box-shadow:0 0 6px rgba(200,255,46,.6)}
.row.done{border-color:rgba(200,255,46,.45);background:linear-gradient(90deg,rgba(200,255,46,.10),var(--card) 70%)}
.row .go{color:var(--faint)}
.row.done .go{color:var(--volt)}

/* bottom tabs: floating pill */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;width:min(340px,calc(100% - 32px));
  background:rgba(22,25,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:24px;display:flex;padding:6px;gap:6px;
  box-shadow:0 16px 40px rgba(0,0,0,.55)}
nav.tabs button{flex:1;padding:10px 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--muted);border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{background:var(--volt);color:var(--onvolt)}

/* step screen */
.screen{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 75%,transparent);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
.top .x{width:46px;height:46px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.segs i.on{background:var(--volt)}
.segs i.cur{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}
.top .cnt{font-family:var(--disp);font-size:20px;font-weight:800;font-style:italic;color:var(--ink);min-width:40px;text-align:right}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#111 center/cover no-repeat;border-radius:22px;overflow:hidden;cursor:pointer}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18)}
.video .play b{width:72px;height:72px;border-radius:50%;background:var(--volt);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.demo{position:relative;background:#F4F5F7;border-radius:26px;aspect-ratio:3/2;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2% 0;display:block}
.demo.off{display:grid;place-items:center;color:#646B7B;font-size:15px;font-weight:600;padding:20px;text-align:center}
.th{background-color:#F2F3F5 !important;background-size:contain !important}
.vlinks{display:flex;justify-content:space-between;gap:8px;padding:10px 2px 0;font-size:14px;font-weight:700}
.vlinks a,.vlinks button{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px}
.vlinks .alt{color:var(--volt)}
.ttl{margin:16px 2px 0}
.ttl h2{margin:0;font-family:var(--disp);font-size:40px;font-weight:800;font-style:italic;letter-spacing:-.3px;line-height:.98;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chip:first-child{background:rgba(200,255,46,.12);border-color:rgba(200,255,46,.35);color:var(--volt)}
.feel{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--heat);font-size:16px;font-weight:600}
.feel svg{color:var(--heat);margin-top:1px}

/* tracker */
.trk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;margin-top:14px;position:relative;overflow:hidden}
.trk::before{content:"";position:absolute;left:50%;top:-60px;width:260px;height:160px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(200,255,46,.14),transparent);pointer-events:none}
.reps{display:flex;align-items:baseline;justify-content:center;gap:8px;position:relative}
.reps strong{font-family:var(--disp);font-size:64px;font-weight:800;font-style:italic;letter-spacing:-1px;line-height:.9}
.reps span{font-size:16px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.circles{display:flex;justify-content:center;gap:12px;margin-top:16px}
.circ{width:64px;height:64px;border-radius:20px;border:2px solid var(--line);background:var(--card2);font-family:var(--disp);font-size:28px;font-weight:800;font-style:italic;display:grid;place-items:center;color:var(--faint)}
.circ.w{border-style:dashed;font-size:22px}
.circ.next{border-color:var(--volt);color:var(--volt);box-shadow:0 0 0 4px rgba(200,255,46,.12),0 0 20px rgba(200,255,46,.25)}
.circ.on{background:var(--volt);border-color:var(--volt);color:var(--onvolt);border-style:solid}
.lbls{display:flex;justify-content:center;gap:12px;margin-top:7px}
.lbls span{width:64px;text-align:center;font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.wt{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.wt button{width:58px;height:58px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:30px;font-weight:600;display:grid;place-items:center;line-height:1}
.wt .v{flex:1;text-align:center}
.wt .v strong{font-family:var(--disp);font-size:44px;font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;line-height:1}
.wt .v span{font-size:16px;font-weight:800;color:var(--muted)}
.wt .v small{display:block;font-size:13px;color:var(--volt);font-weight:700;margin-top:2px}

/* accordion */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:12px;padding:0 16px}
details.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 0;font-weight:800;font-size:17px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{margin-left:auto;transition:transform .2s;color:var(--faint)}
details.acc[open] summary .chev{transform:rotate(90deg)}
.steps{margin:0;padding:0 0 12px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:5px 0 9px 42px;font-size:17px}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:30px;height:30px;border-radius:10px;background:var(--volt);color:var(--onvolt);display:grid;place-items:center;font-family:var(--disp);font-size:18px;font-weight:800;font-style:italic}
.avoid{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:rgba(255,90,31,.10);border:1px solid rgba(255,90,31,.3);color:#FFB89C;font-size:16px}
.avoid b{display:block;margin-bottom:4px;color:var(--heat);text-transform:uppercase;letter-spacing:1px;font-size:13px}
.avoid div{padding:2px 0}
.tip{margin:0 0 14px;font-size:16px;color:var(--muted)}

/* warm-up step */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.wbox{background:var(--card);border-radius:20px;overflow:hidden;text-align:left;border:2px solid var(--line);position:relative;transition:border-color .2s,transform .12s}
.wbox:active{transform:scale(.97)}
.wbox .th{height:100px;background:#F2F3F5 center/contain no-repeat;position:relative}
.wbox .th .pl{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:12px;background:var(--bg);color:var(--volt);display:grid;place-items:center}
.wbox .nm{padding:10px 12px 12px;font-weight:800;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:8px}
.wbox .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-left:auto}
.wbox.done{border-color:var(--volt);box-shadow:0 0 0 3px rgba(200,255,46,.12)}
.wbox.done .ck{background:var(--volt);border-color:var(--volt)}
.lead{margin:8px 2px 0;color:var(--muted);font-size:17px}

/* footer action */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(to top,var(--bg) 82%,transparent);padding:22px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot .sec-b{width:64px;height:66px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.foot .pri{flex:1;height:66px;border-radius:20px;background:#fff;color:var(--onvolt);font-family:var(--disp);font-weight:800;font-style:italic;font-size:25px;text-transform:uppercase;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.foot .pri.ok{background:var(--volt);box-shadow:0 12px 30px -8px rgba(200,255,46,.55)}

/* timer */
.timer{position:fixed;inset:0;z-index:40;background:radial-gradient(80% 50% at 50% 40%,rgba(200,255,46,.10),transparent 70%),rgba(7,8,11,.98);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.timer .l{font-size:15px;font-weight:800;color:var(--volt);text-transform:uppercase;letter-spacing:4px}
.ring{position:relative;width:260px;height:260px;margin:14px 0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(200,255,46,.45))}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:110px;font-weight:800;font-style:italic;font-variant-numeric:tabular-nums}
.timer .nx{font-size:19px;font-weight:700;opacity:.9}
.timer .btns{display:flex;gap:12px;margin-top:28px}
.timer button{background:var(--volt);color:var(--onvolt);font-weight:800;padding:17px 28px;border-radius:18px;font-size:18px}
.timer button.g{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff}

/* celebration */
.cele{text-align:center;padding-top:calc(60px + env(safe-area-inset-top))}
.cele .big{width:132px;height:132px;border-radius:40px;background:var(--volt);display:grid;place-items:center;margin:0 auto;animation:pop .5s ease;box-shadow:0 0 0 10px rgba(200,255,46,.12),0 0 60px rgba(200,255,46,.5);transform:rotate(-6deg)}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.1) rotate(-4deg)}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.cele h2{font-family:var(--disp);font-size:52px;font-weight:800;font-style:italic;text-transform:uppercase;margin:28px 0 6px;line-height:.95}
.cele p{color:var(--muted);margin:0;font-weight:600}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 0}
.nums div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.nums strong{display:block;font-family:var(--disp);font-size:52px;font-weight:800;font-style:italic;color:var(--volt);line-height:1}
.nums small{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.nextup{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;text-align:left}
.nextup .dot{width:14px;height:14px;border-radius:50%}
.nextup small{display:block;color:var(--faint);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.nextup b{font-size:19px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-size:32px;font-weight:800;font-style:italic;text-transform:uppercase}
.sheet .tipline{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:17px}

</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>

<script>
/* ================= dates & cycle ================= */
// Days are dates ("2026-11-14"). Workout for a date: plan.cycle (repeats, skipping restDays) or plan.week (by weekday).
const WD = ["sun","mon","tue","wed","thu","fri","sat"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
const fmt = (s,o) => fromIso(s).toLocaleDateString("en-IN",o);
const todayKey = () => iso(new Date());

function workoutKeyFor(day){
  const c = P.cycle;
  const start = isGuest() && isIso(store.get("myStart","")) ? store.get("myStart") : c?.start;
  if(c?.order?.length && isIso(start)){
    const rest = c.restDays || [];
    const isRest = s => rest.includes(WD[fromIso(s).getDay()]);
    if(isRest(day)) return "rest";
    // count training days between start and this day
    let n = 0;
    if(day >= start){ for(let s=start; s<day; s=addDays(s,1)) if(!isRest(s)) n++; }
    else { for(let s=day; s<start; s=addDays(s,1)) if(!isRest(s)) n--; }
    const L = c.order.length; return c.order[((n % L) + L) % L];
  }
  return P.week?.[WD[fromIso(day).getDay()]];
}
const workoutFor = day => P.workouts[workoutKeyFor(day)] || P.workouts.rest || {name:"Rest Day",warmup:[],main:[],cooldown:[]};
function nextTraining(day){ for(let i=1;i<10;i++){ const d=addDays(day,i), w=workoutFor(d); if((w.main||[]).length) return {d,w}; } return null; }

/* ================= icons ================= */
const sv = (p,s=22,sw=2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  play:(s=24,c="#12141C")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`,
  check:(s=18,c="#0A0C11")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  back:()=>sv('<path d="M15 18l-6-6 6-6"/>',24,2.5),
  next:()=>sv('<path d="M9 6l6 6-6 6"/>',22,2.5),
  x:()=>sv('<path d="M6 6l12 12M18 6L6 18"/>',22,2.5),
  info:()=>sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>',22),
  home:()=>sv('<path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',26,2),
  grid:()=>sv('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',26,2),
  dumb:()=>sv('<path d="M7 12h10M4 8.5v7M7 6.5v11M17 6.5v11M20 8.5v7"/>',18),
  clock:()=>sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',18),
  target:()=>sv('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',20),
  book:()=>sv('<path d="M5 4.5h10a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10"/>',22),
  tool:()=>sv('<path d="M14.5 6.5l3-3 3 3-3 3M17.5 3.5L9 12M4 20l5-5"/>',16),
  ext:()=>sv('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',15,2.4),
  search:()=>sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',20,2.4),
  moon:()=>sv('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',22),
};

/* ================= state ================= */
let P = null, timerInt = null;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const prog = () => store.get("prog:"+todayKey(), {});
const setProg = p => store.set("prog:"+todayKey(), p);
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app = () => document.getElementById("app");
// Shared copy: opened with ?join, each person types their own name and their plan starts on their first day.
if(new URLSearchParams(location.search).has("join")) store.set("guest", true);
const isGuest = () => store.get("guest", false);
const myName = () => isGuest() ? store.get("myName","") : (P.name || "");
const greeting = () => isGuest() ? "Hello " + myName() : (P.greeting || "Hello");

/* ================= load plan ================= */
async function load(){
  const cached = store.get("plan", null);
  if(cached && !P){ P = cached; route(); }
  try{
    const r = await fetch("plan.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const fresh = await r.json();
    const changed = cached && JSON.stringify(cached) !== JSON.stringify(fresh);
    P = fresh; store.set("plan", fresh);
    if(!cached || changed) route();
    if(changed) toast("Your plan was updated");
  }catch(e){
    if(!P) $app().innerHTML = '<div class="empty">Please turn on the internet and open the app again.</div>';
  }
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent="✓  "+t; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); }

/* ================= workout helpers ================= */
const ytId = u => { if(!u) return null; const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u)?u:null); };
// list thumbnails: the short demo animation if there is one, else the YouTube still
const thumb = ex => { if(ex?.thumb) return ex.thumb; if(ex?.demo) return ex.demo; const id=ytId(ex?.video); return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : ""; };
const setsOf = it => (it.warmupSets||0) + (it.sets||1);
const k = (sec,i) => sec+"/"+i;
function doneCount(sec,i){ return (prog()[k(sec,i)]||[]).filter(Boolean).length; }
function nextOpen(arr,total){ for(let x=0;x<total;x++) if(!arr[x]) return x; return -1; }
function isDone(sec,i,it){ return doneCount(sec,i) >= setsOf(it); }
// "Machine busy" swaps for one day: {"main/2":"cable_fly"}
const swaps = day => store.get("swap:"+day, {});
const exOf = (day, s) => swaps(day)[k(s.sec,s.i)] || s.it.ex;
function doSwap(day, n, alt){
  const s = stepsOf(workoutFor(day))[n], sw = swaps(day), key = k(s.sec,s.i);
  if(!alt || alt===s.it.ex) delete sw[key]; else sw[key] = alt;
  store.set("swap:"+day, sw); buzz(); toast(alt && alt!==s.it.ex ? "Changed for today" : "Back to your plan"); go(`w/${day}/${n}`);
}
// share of main sets done on a day (for the weekly count)
function dayPct(d){
  const w = workoutFor(d), pr = store.get("prog:"+d, {}); let t=0, n=0;
  (w.main||[]).forEach((it,i)=>{ t += setsOf(it); n += Math.min((pr[k("main",i)]||[]).filter(Boolean).length, setsOf(it)); });
  return t ? n/t*100 : 0;
}
// keep the screen on during a workout
let wake = null;
async function keepAwake(on){
  try{
    if(on){ if(!wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", ()=>{ wake=null; }); } }
    else if(wake){ const x = wake; wake = null; await x.release(); }
  }catch(e){}
}
// steps of a guided workout: warm-up (one screen), each main exercise, each finisher, then done
function stepsOf(w){
  const s = [];
  if((w.warmup||[]).length) s.push({sec:"warmup"});
  (w.main||[]).forEach((it,i)=>s.push({sec:"main",i,it}));
  (w.cooldown||[]).forEach((it,i)=>s.push({sec:"cooldown",i,it}));
  return s;
}
function minutes(w){
  let s = (w.warmup||[]).length ? 300 : 0;
  (w.main||[]).forEach(it => s += setsOf(it)*(40+(it.rest||60)));
  (w.cooldown||[]).forEach(it => { const m=/(\d+)\s*min/.exec(it.time||""); s += m ? m[1]*60 : 120; });
  return Math.round(s/300)*5;
}
function progressPct(w){
  let t=0,d=0;
  (w.main||[]).forEach((it,i)=>{ t+=setsOf(it); d+=Math.min(doneCount("main",i),setsOf(it)); });
  (w.cooldown||[]).forEach((it,i)=>{ t+=1; d+=Math.min(doneCount("cooldown",i),1); });
  return t ? Math.round(d/t*100) : 0;
}
function firstOpenStep(w){
  const st = stepsOf(w);
  const warmTouched = (w.warmup||[]).some((_,i)=>doneCount("warmup",i));
  const anyMain = (w.main||[]).some((_,i)=>doneCount("main",i));
  for(let n=0;n<st.length;n++){
    const s = st[n];
    if(s.sec==="warmup"){ if(!warmTouched && !anyMain) return n; continue; }
    if(!isDone(s.sec,s.i,s.it)) return n;
  }
  return st.length; // all done
}

/* ================= routing ================= */
window.addEventListener("hashchange", route);
const go = h => { location.hash = h; };
let selDay = null;
function route(){
  if(!P) return;
  stopTimer(); closeSheet();
  if(isGuest() && !myName()) return renderJoin();
  const [v,a,b,c] = decodeURIComponent(location.hash.slice(1)).split("/");
  if(v==="w" && isIso(a)) return renderStep(a, +b||0);
  keepAwake(false);
  if(v==="lib" && a) return renderLibEx(a, isIso(b) ? b : null, +c||0);
  if(v==="lib") return renderLib();
  selDay = (v==="day" && isIso(a)) ? a : todayKey();
  renderHome();
}

/* ================= HOME ================= */
function renderHome(){
  const day = selDay, isToday = day===todayKey(), w = workoutFor(day);
  const nMain = (w.main||[]).length, pct = isToday ? progressPct(w) : 0;
  let h = `<div class="wrap rise">
    <div class="hd"><div><div class="date">${fmt(todayKey(),{weekday:"long",day:"numeric",month:"long"})}</div>
      <h1>${esc(greeting())}</h1></div>
      <button class="icon-btn" onclick="openTips()" aria-label="How to train">${I.info()}</button></div>`;
  const wk = [0,1,2,3,4,5,6].filter(i=>dayPct(addDays(todayKey(),-i))>=50).length;
  h += `<div class="streak">${wk ? `🔥 <b>${wk}</b> workout${wk>1?"s":""} done in the last 7 days` : `💪 Let's start strong!`}</div>`;

  h += `<div class="days">` + [0,1,2,3,4,5,6].map(n=>{ const d = addDays(todayKey(),n);
    const ww = workoutFor(d);
    return `<button class="day ${d===day?"sel":""} ${n===0?"today":""}" onclick="buzz();go('day/${d}')" aria-label="${fmt(d,{weekday:"long"})}: ${esc(ww.name)}">
      <span class="d">${n===0?"Today":fmt(d,{weekday:"short"})}</span><span class="n">${fromIso(d).getDate()}</span>
      <span class="dot" style="background:${ww.color||"#999"}"></span></button>`;
  }).join("") + `</div>`;

  h += `<div class="hero" style="--c:${w.color||"#555"}">
    <div class="lbl">${isToday ? "Today" : fmt(day,{weekday:"long",day:"numeric",month:"short"})}</div>
    <h2>${esc(w.name)}</h2>`;
  if(nMain){
    h += `<div class="tags">${String(w.focus||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div class="stats"><span>${I.dumb()} ${nMain} exercises</span><span>${I.clock()} ${minutes(w)} min</span></div>`;
    if(isToday){
      const st = stepsOf(w), open = firstOpenStep(w), started = pct>0 || (w.warmup||[]).some((_,i)=>doneCount("warmup",i));
      h += `<div class="bar"><i style="width:${pct}%"></i></div>
        <button class="start" onclick="buzz();go('w/${day}/${open>=st.length?st.length:open}')">
        ${open>=st.length ? `${I.check(22)} Done today` : started ? `${I.play(22)} Continue` : `${I.play(22)} Start Workout`}</button>`;
    }
  } else {
    const nx = nextTraining(day);
    h += `<div class="note">${esc(w.note||"Rest today.")}</div>
      ${nx ? `<div class="tags"><span>Next: ${esc(nx.w.name)} · ${fmt(nx.d,{weekday:"long"})}</span></div>` : ""}`;
  }
  h += `</div>`;

  if((w.warmup||[]).length){
    h += `<div class="sec"><h3>Warm-up</h3><small>Pick any · 5 min</small></div><div class="hscroll">` +
      w.warmup.map((it,i)=>{ const ex=P.exercises[it.ex]; if(!ex) return "";
        return `<button class="wcard ${isToday&&doneCount("warmup",i)?"done":""}" onclick="go('lib/${it.ex}')">
          <div class="th" style="background-image:url('${thumb(ex)}')"></div><div class="nm">${esc(ex.name)}</div>
          <span class="tick">${I.check(15)}</span></button>`; }).join("") + `</div>`;
  }
  const stp = stepsOf(w);
  if(nMain){
    h += `<div class="sec"><h3>Exercises</h3><small>Warm-up set + 3 × 12</small></div>`;
    w.main.forEach((it,i)=> h += rowHtml(day, stp.findIndex(s=>s.sec==="main"&&s.i===i), it, i+1, isToday ? doneCount("main",i) : 0, exOf(day,{sec:"main",i,it})));
  }
  if((w.cooldown||[]).length){
    h += `<div class="sec"><h3>Finish</h3></div>`;
    w.cooldown.forEach((it,i)=> h += rowHtml(day, stp.findIndex(s=>s.sec==="cooldown"&&s.i===i), it, null, isToday ? doneCount("cooldown",i) : 0, exOf(day,{sec:"cooldown",i,it})));
  }
  h += `</div>` + tabs("home");

/* ================= GUIDED STEP ================= */
function topBar(day, n, total){
  return `<div class="top"><button class="x" onclick="go('day/${day}')" aria-label="Close">${I.x()}</button>
    <div class="segs">${Array.from({length:total},(_,j)=>`<i class="${j<n?"on":j===n?"cur":""}"></i>`).join("")}</div>
    <span class="cnt">${Math.min(n+1,total)}/${total}</span></div>`;
}
function renderStep(day, n){
  const w = workoutFor(day), st = stepsOf(w), isToday = day===todayKey();
  if(!st.length) return go("day/"+day);
  if(n >= st.length) return isToday ? renderDone(day) : go("day/"+day);
  const s = st[n];
  let h = `<div class="screen">${topBar(day,n,st.length)}<div class="wrap">`;

  if(s.sec==="warmup"){
    h += `<div class="ttl"><h2>Warm-up</h2></div><p class="lead">Pick any 4–5. Tap a card when done.</p><div class="wgrid">` +
      w.warmup.map((it,i)=>{ const ex=P.exercises[it.ex]; if(!ex) return "";
        const d = isToday && doneCount("warmup",i);
        return `<div class="wbox ${d?"done":""}" ${isToday?`onclick="toggleWarm(${i},'${day}',${n})"`:""}>
          <div class="th" style="background-image:url('${ex.demo || thumb(ex)}')"><button class="pl" onclick="event.stopPropagation();go('lib/${it.ex}')" aria-label="Watch ${esc(ex.name)}">${I.play(14,"currentColor")}</button></div>
          <div class="nm"><span>${esc(ex.name)}</span>${isToday?`<span class="ck">${d?I.check(14):""}</span>`:""}</div></div>`; }).join("") + `</div>`;
    h += `</div></div>` + foot(day, n, null, `<button class="pri" onclick="buzz();go('w/${day}/${n+1}')">Start exercises ${I.next()}</button>`);
    $app().innerHTML = h; window.scrollTo(0,0); return;
  }

  keepAwake(isToday);
  const it = s.it, exId = exOf(day,s), ex = P.exercises[exId] || {name:exId};
  const total = setsOf(it), done = isToday ? doneCount(s.sec,s.i) : 0, arr = isToday ? (prog()[k(s.sec,s.i)]||[]) : [];
  if(exId !== it.ex) h += `<div class="swapnote"><span>Instead of <b>${esc(P.exercises[it.ex]?.name)}</b></span><button onclick="doSwap('${day}',${n},'')">Undo</button></div>`;
  h += videoBlock(ex);
  h += `<div class="ttl"><h2>${esc(ex.name)}</h2>
    <div class="chips"><span class="chip">${esc(ex.part)}</span>${ex.equipment && ex.equipment!=="None" ? `<span class="chip">${I.tool()} ${esc(ex.equipment)}</span>` : ""}</div></div>`;
  if(ex.feel) h += `<div class="feel">${I.target()}<span>${esc(ex.feel)}</span></div>`;

  // tracker
  h += `<div class="trk">`;
  if(it.sets){
    const wu = it.warmupSets||0;
    h += `<div class="reps"><strong>${esc(it.reps)}</strong><span>reps</span></div>
      <div class="circles">${Array.from({length:total},(_,j)=>{
        const on = arr[j], isNext = isToday && j===nextOpen(arr,total) && !on;
        return `<button class="circ ${j<wu?"w":""} ${on?"on":""} ${isNext?"next":""}" ${isToday?`onclick="tapSet('${day}',${n},${j})"`:"disabled"}
          aria-label="${j<wu?"Warm-up set":"Set "+(j-wu+1)}">${on ? I.check(24) : (j<wu ? "W" : j-wu+1)}</button>`; }).join("")}</div>
      <div class="lbls">${Array.from({length:total},(_,j)=>`<span>${j<wu?"Warm-up":"Set "+(j-wu+1)}</span>`).join("")}</div>`;
    h += weightRow(exId);
    if(isToday && done >= total) h += feelRow(exId);
  } else {
    h += `<div class="reps"><strong>${esc(it.time||it.reps||"")}</strong></div>
      <div class="circles"><button class="circ ${arr[0]?"on":"next"}" ${isToday?`onclick="tapSet('${day}',${n},0)"`:"disabled"} aria-label="Done">${arr[0]?I.check(24):I.check(24,"currentColor")}</button></div>`;
  }
  h += `</div>`;

  // how to (collapsed)
  if(ex.steps?.length){
    h += `<details class="acc"><summary>${I.book()} How to do it <span class="chev">${I.next()}</span></summary>
      <ol class="steps">${ex.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${ex.mistakes?.length ? `<div class="avoid"><b>Avoid</b>${ex.mistakes.map(x=>`<div>✕ ${esc(x)}</div>`).join("")}</div>` : ""}
      ${ex.tip ? `<p class="tip">💡 ${esc(ex.tip)}</p>` : ""}</details>`;
  }
  h += altBlock(it.ex, {day, n, cur:exId});
  h += `</div></div>`;

  // one big action button
  let pri;
  const last = n === st.length-1;
  if(isToday && done < total){
    const j = nextOpen(arr,total);
    const lbl = !it.sets ? "Done" : j < (it.warmupSets||0) ? "Warm-up set done" : `Set ${j-(it.warmupSets||0)+1} done`;
    pri = `<button class="pri ok" onclick="tapSet('${day}',${n},${j})">${I.check(22)} ${lbl}</button>`;
  } else {
    pri = `<button class="pri" onclick="buzz();go('w/${day}/${n+1}')">${last ? (isToday ? "Finish workout" : "Back to plan") : "Next exercise"} ${I.next()}</button>`;
  }
  const nxs = st[n+1], upNext = nxs ? P.exercises[exOf(day,nxs)]?.name : null;
  h += foot(day, n, upNext ? `<div class="un">Up next · <b>${esc(upNext)}</b></div>` : "", pri);
  $app().innerHTML = h; window.scrollTo(0,0);
}
function foot(day, n, top, pri){
  return `<div class="foot">${top||""}<div class="in">
    <button class="sec-b" onclick="buzz();${n>0?`go('w/${day}/${n-1}')`:`go('day/${day}')`}" aria-label="Back">${I.back()}</button>${pri}</div></div>`;
}
function toggleWarm(i, day, n){
  buzz(); const p = prog(), key = k("warmup",i); p[key] = p[key]?.[0] ? [] : [true]; setProg(p); renderStep(day, n);
}
function tapSet(day, n, j){
  buzz();
  const w = workoutFor(day), st = stepsOf(w), s = st[n], it = s.it, total = setsOf(it);
  const p = prog(), key = k(s.sec,s.i), arr = p[key] || [];
  arr[j] = !arr[j]; p[key] = arr; setProg(p);
  renderStep(day, n);
  if(!arr[j]) return;                       // un-ticked: no timer
  const done = arr.filter(Boolean).length;
  if(!it.sets){ setTimeout(()=>go(`w/${day}/${n+1}`), 350); return; }
  const allDone = done >= total, wu = it.warmupSets||0;
  const nextIdx = nextOpen(arr,total);
  const nextEx = st[n+1]?.it ? P.exercises[exOf(day,st[n+1])]?.name : null;
  const txt = allDone ? (nextEx ? "Next: " + nextEx : "Last one done!")
            : (nextIdx < wu ? "Next: Warm-up set" : `Next: Set ${nextIdx-wu+1} of ${it.sets}`) + (j < wu ? " — working weight" : "");
  const rest = j < wu ? Math.min(it.rest||60, 60) : (it.rest||60);
  startTimer(rest, txt, allDone ? `w/${day}/${n+1}` : null, allDone ? exOf(day,s) : null);
}

/* ================= weight ================= */
const wlog = ex => store.get("w:"+ex, []);
function weightInfo(ex){ const L=wlog(ex), t=todayKey(); return { today:(L.find(e=>e.d===t)||{}).kg ?? null, prev:[...L].reverse().find(e=>e.d!==t) }; }
// weight to show today, using how the last session felt
function suggest(ex){
  const w = weightInfo(ex), p = w.prev;
  if(w.today != null) return {kg:w.today, note: p ? `Last time ${p.kg} kg` : "Your weight"};
  if(!p) return {kg:0, note:"Set your weight"};
  if(p.feel==="easy" && p.kg>0) return {kg:p.kg+2.5, note:`${p.kg} kg was easy. Try ${p.kg+2.5} kg ↑`, up:true};
  if(p.feel==="hard") return {kg:p.kg, note:`${p.kg} kg was hard. Stay at this weight`};
  return {kg:p.kg, note:`Last time ${p.kg} kg`};
}
const FEELS = [["easy","😊","Easy"],["good","💪","Good"],["hard","😓","Hard"]];
function feelRow(ex){
  const cur = (wlog(ex).find(e=>e.d===todayKey())||{}).feel;
  return `<div class="howq">How was it?</div><div class="feelb">${FEELS.map(([f,e,l])=>`<button class="${cur===f?"on":""}" onclick="setFeel('${ex}','${f}',this)"><span>${e}</span>${l}</button>`).join("")}</div>`;
}
function setFeel(ex, f, btn){
  buzz();
  const L = wlog(ex), t = todayKey(), i = L.findIndex(e=>e.d===t);
  if(i>=0) L[i].feel = f; else L.push({d:t, kg:suggest(ex).kg, feel:f});
  store.set("w:"+ex, L.slice(-40));
  btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===btn));
}
function weightRow(ex){
  const sg = suggest(ex);
  return `<div class="wt"><button onclick="setWeight('${ex}',-2.5)" aria-label="Less weight">−</button>
    <div class="v"><strong id="wkg">${sg.kg}</strong> <span>kg</span>
    <small class="${sg.up?"up":""}">${esc(sg.note)}</small></div>
    <button onclick="setWeight('${ex}',2.5)" aria-label="More weight">+</button></div>`;
}
function setWeight(ex, delta){
  buzz();
  const L = wlog(ex), t = todayKey();
  const kg = Math.max(0, Math.round((suggest(ex).kg + delta)*10)/10);
  const i = L.findIndex(e=>e.d===t); if(i>=0) L[i].kg = kg; else L.push({d:t,kg});
  store.set("w:"+ex, L.slice(-40));
  const el = document.getElementById("wkg"); if(el) el.textContent = kg;
}

/* ================= timer ================= */
function startTimer(sec, nextTxt, nextHash, feelEx){
  stopTimer();
  let left = sec, total = sec; const R = 110, C = 2*Math.PI*R;
  const el = document.createElement("div"); el.className="timer"; el.id="timer";
  el.innerHTML = `<div class="l">Rest</div>
    <div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="${R}" stroke="rgba(255,255,255,.08)" stroke-width="14" fill="none"/>
      <circle id="arc" cx="120" cy="120" r="${R}" stroke="#C8FF2E" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" style="transition:stroke-dashoffset 1s linear"/></svg>
      <div class="n" id="tn">${left}</div></div>
    <div class="nx">${esc(nextTxt)}</div>
    ${feelEx ? `<div class="tfeel">${feelRow(feelEx)}</div>` : ""}
    <div class="btns"><button class="g" id="add15">+15 sec</button><button id="skip">Skip</button></div>`;
  document.body.appendChild(el);
  const paint = () => { document.getElementById("tn").textContent = left; document.getElementById("arc").style.strokeDashoffset = C*(1-left/total); };
  document.getElementById("add15").onclick = () => { buzz(); left += 15; total = Math.max(total,left); paint(); };
  document.getElementById("skip").onclick = () => { buzz(); endTimer(nextHash); };
  timerInt = setInterval(()=>{ left--; paint(); if(left<=0){ beep(); endTimer(nextHash); } }, 1000);
}
function endTimer(h){ stopTimer(); if(h) go(h); }
function stopTimer(){ clearInterval(timerInt); timerInt=null; const t=document.getElementById("timer"); if(t) t.remove(); }
function beep(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){}
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    [0,.35].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.4,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3); o.start(a.currentTime+t); o.stop(a.currentTime+t+.3); }); }catch(e){}
}

// exercises in any workout of the plan
function planIds(){ const s=new Set(); Object.values(P.workouts).forEach(w=>items(w).forEach(x=>s.add(x.it.ex))); return s; }
function items(w){ const o=[]; ["warmup","main","cooldown"].forEach(s=>(w[s]||[]).forEach((it,i)=>o.push({sec:s,i,it}))); return o; }
// listed alternatives, or else other exercises for the same muscle
function altsFor(id){
  const ex = P.exercises[id]; if(!ex || ex.group==="Warm-up") return {list:[], own:false};
  if(ex.alts?.length) return {list: ex.alts.filter(a=>P.exercises[a]), own:true};
  return {list: Object.keys(P.exercises).filter(k=>k!==id && ex.sub && P.exercises[k].sub===ex.sub).slice(0,4), own:false};
}
function altBlock(id, ctx){

  if(!list.length) return "";
  const to = a => ctx ? `lib/${a}/${ctx.day}/${ctx.n}` : `lib/${a}`;
  return `<div class="sec"><h3>${own ? "Machine busy? Do one of these" : "Other options, same muscle"}</h3></div>

        <div class="nm">${esc(ex.name)}<small>${esc(ex.equipment && ex.equipment!=="None" ? ex.equipment : ex.part)}</small></div></button>`; }).join("")}</div>`;
}

function renderLib(q=""){

  const ids = all.filter(id=>{ const ex=P.exercises[id];
    if(q) return [ex.name,ex.part,ex.group,ex.sub,ex.equipment].join(" ").toLowerCase().includes(q.toLowerCase());
    return libGroup==="All" || (ex.group||"Other")===libGroup; });
  let h = `<div class="wrap lib"><div class="hd"><div><div class="date">${all.length} exercises</div><h1>Exercises</h1></div></div>
    <label class="search">${I.search()}<input id="q" placeholder="Search (chest, cable, dumbbell…)" value="${esc(q)}" oninput="libSearch(this.value)"></label>
    ${q ? "" : `<div class="gchips">${["All",...groupsOrder].map(g=>`<button class="${g===libGroup?"on":""}" onclick="buzz();libGroup='${g}';renderLib()">${esc(g)}</button>`).join("")}</div>`}`;
  if(!ids.length) h += `<div class="empty">Nothing found</div>`;
  // headings: group (when showing all) and sub-group
  let lastG = null, lastS = null;
  ids.forEach(id=>{ const ex=P.exercises[id], g=ex.group||"Other", s=ex.sub||g;
    if(g!==lastG && (libGroup==="All"||q)){ h += `<div class="ghead">${esc(g)}</div>`; lastS=null; }
    if(s!==lastS && s!==g){ h += `<div class="sec"><h3>${esc(s)}</h3></div>`; }
    lastG=g; lastS=s;
    h += `<button class="row" onclick="go('lib/${id}')"><div class="th" style="background-image:url('${thumb(ex)}')"></div>
      <div class="bd"><div class="nm">${esc(ex.name)}</div><div class="sub">${esc(ex.equipment && ex.equipment!=="None" ? ex.equipment : ex.part)}</div>
      ${inPlan.has(id) ? `<span class="badge">In your plan</span>` : ""}</div><span class="go">${I.next()}</span></button>`;
  });
  $app().innerHTML = h + `</div>` + tabs("lib");
  window.scrollTo(0,0);
}
function libSearch(v){ renderLib(v); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(v.length,v.length); }
function renderLibEx(id, day, n){
  const ex = P.exercises[id]; if(!ex) return go("lib");
  const slot = day && day===todayKey() ? stepsOf(workoutFor(day))[n] : null;
  const isOrig = slot && slot.it.ex===id;
  const act = slot ? `<div class="foot"><div class="in"><button class="sec-b" onclick="buzz();history.back()" aria-label="Back">${I.back()}</button>
    <button class="pri ok" onclick="doSwap('${day}',${n},'${isOrig?"":id}')">${I.check(22)} ${isOrig ? "Do this one" : "Do this instead"}</button></div></div>` : "";
  $app().innerHTML = `<div class="screen" style="padding-bottom:${slot?"120px":"40px"}"><div class="top"><button class="x" onclick="history.length>1?history.back():go('lib')" aria-label="Back">${I.back()}</button></div>
    <div class="wrap">${videoBlock(ex)}<div class="ttl"><h2>${esc(ex.name)}</h2>
    <div class="chips"><span class="chip">${esc(ex.part)}</span>${ex.equipment && ex.equipment!=="None" ? `<span class="chip">${I.tool()} ${esc(ex.equipment)}</span>` : ""}</div></div>
    ${ex.feel ? `<div class="feel">${I.target()}<span>${esc(ex.feel)}</span></div>` : ""}
    ${ex.steps?.length ? `<details class="acc" open><summary>${I.book()} How to do it <span class="chev">${I.next()}</span></summary>
      <ol class="steps">${ex.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${ex.mistakes?.length ? `<div class="avoid"><b>Avoid</b>${ex.mistakes.map(x=>`<div>✕ ${esc(x)}</div>`).join("")}</div>` : ""}
      ${ex.tip ? `<p class="tip">💡 ${esc(ex.tip)}</p>` : ""}</details>` : ""}
    ${altBlock(id)}</div></div>${act}`;
  window.scrollTo(0,0);
}

/* ================= start ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && P){ load(); if(location.hash.startsWith("#w/")) keepAwake(true); } });
load();
</script>
