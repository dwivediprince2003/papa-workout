<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Plan</title>
<meta name="theme-color" content="#F4F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#12141C; --muted:#646B7B; --faint:#9298A6; --line:#E4E7ED; --soft:#ECEEF3;
  --ok:#1F9D57; --okbg:#E5F5EC; --accent:#12141C; --onaccent:#FFFFFF;
  --r:22px; --shadow:0 1px 2px rgba(18,20,28,.04),0 8px 24px rgba(18,20,28,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0D0F14; --card:#171A22; --ink:#F2F3F6; --muted:#A2A8B5; --faint:#717888; --line:#262A35; --soft:#1F232D;
    --okbg:#11301F; --accent:#F2F3F6; --onaccent:#0D0F14; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4;min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.97)}
svg{display:block;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 4px}
.hd .date{font-size:14px;font-weight:600;color:var(--muted)}
.hd h1{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-.6px}
.icon-btn{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}

/* days strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 0}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 10px;border-radius:16px;min-width:0;border:2px solid transparent}
.day .d{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase}
.day .n{font-size:18px;font-weight:800}
.day .dot{width:8px;height:8px;border-radius:50%}
.day.sel{background:var(--card);box-shadow:var(--shadow);border-color:var(--ink)}
.day.today .d{color:var(--ink)}

/* hero */
.hero{border-radius:var(--r);padding:22px 20px 20px;color:#fff;margin-top:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .lbl{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.hero h2{margin:4px 0 0;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:600}
.hero .stats{display:flex;gap:18px;margin-top:14px;font-size:15px;font-weight:600;opacity:.95}
.hero .stats span{display:flex;align-items:center;gap:6px}
.hero .note{margin-top:12px;font-size:17px;position:relative;z-index:1}
.bar{height:6px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:6px}
.start{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;background:#fff;color:#12141C;
  font-weight:800;font-size:20px;padding:18px;border-radius:16px;position:relative;z-index:1}

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.sec small{font-size:14px;color:var(--faint);font-weight:600}

/* warm-up chips (horizontal) */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wcard{flex:none;width:132px;scroll-snap-align:start;text-align:left;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.wcard .th{height:78px;background:#222 center/cover no-repeat}
.wcard .nm{padding:9px 10px 11px;font-size:15px;font-weight:700;line-height:1.2}
.wcard .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--ok);display:none;place-items:center}
.wcard.done .tick{display:grid}

/* exercise rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:10px 14px 10px 10px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.row .th{width:76px;height:76px;border-radius:13px;flex:none;background:#222 center/cover no-repeat;position:relative}
.row .num{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.row .bd{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:18px;line-height:1.2}
.row .meta{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:15px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.dots i.w{border-style:dashed}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.row.done{background:var(--okbg)}
.row .go{color:var(--faint)}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--faint)}
nav.tabs button.on{color:var(--ink)}

/* step screen */
.screen{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top .x{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.segs i.on{background:var(--ok)}
.segs i.cur{background:var(--ink)}
.top .cnt{font-size:14px;font-weight:700;color:var(--muted);min-width:34px;text-align:right}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#111 center/cover no-repeat;border-radius:20px;overflow:hidden;cursor:pointer}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18)}
.video .play b{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.demo{background:#fff;border-radius:20px;display:grid;place-items:center;aspect-ratio:3/2;overflow:hidden;box-shadow:var(--shadow)}
.demo img{height:96%;width:auto;max-width:100%;display:block}
.demo.off{color:#646B7B;font-size:15px;font-weight:600;padding:20px;text-align:center}
.th{background-color:#fff !important;background-size:contain !important}
.vlinks{display:flex;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:14px;font-weight:600}
.vlinks a,.vlinks button{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px}
.vlinks .alt{color:var(--ink);font-weight:700}
.ttl{margin:14px 2px 0}
.ttl h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.12}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.feel{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:16px;font-weight:500}
.feel svg{color:#2A72A8;margin-top:1px}

/* tracker */
.trk{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px;margin-top:14px}
.reps{display:flex;align-items:baseline;justify-content:center;gap:8px}
.reps strong{font-size:44px;font-weight:800;letter-spacing:-1px}
.reps span{font-size:18px;font-weight:700;color:var(--muted)}
.circles{display:flex;justify-content:center;gap:12px;margin-top:14px}
.circ{width:62px;height:62px;border-radius:50%;border:3px solid var(--line);font-size:20px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.circ.w{border-style:dashed;font-size:15px}
.circ.next{border-color:var(--ink);color:var(--ink)}
.circ.on{background:var(--ok);border-color:var(--ok);color:#fff;border-style:solid}
.lbls{display:flex;justify-content:center;gap:12px;margin-top:6px}
.lbls span{width:62px;text-align:center;font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase}
.wt{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wt button{width:54px;height:54px;border-radius:50%;background:var(--soft);font-size:28px;font-weight:600;display:grid;place-items:center;line-height:1}
.wt .v{flex:1;text-align:center}
.wt .v strong{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.wt .v span{font-size:16px;font-weight:700;color:var(--muted)}
.wt .v small{display:block;font-size:13px;color:var(--faint);font-weight:600}

/* accordion */
details.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:12px;padding:0 16px}
details.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 0;font-weight:800;font-size:17px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{margin-left:auto;transition:transform .2s;color:var(--faint)}
details.acc[open] summary .chev{transform:rotate(90deg)}
.steps{margin:0;padding:0 0 12px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:5px 0 7px 40px;font-size:17px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:800}
.avoid{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#FFF6E0;color:#6B4E00;font-size:16px}
@media (prefers-color-scheme: dark){ .avoid{background:#2E2610;color:#F0D58A} }
.avoid b{display:block;margin-bottom:4px}
.avoid div{padding:2px 0}
.tip{margin:0 0 14px;font-size:16px;color:var(--muted)}

/* warm-up step */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.wbox{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;text-align:left;border:3px solid transparent;position:relative}
.wbox .th{height:96px;background:#222 center/cover no-repeat;position:relative}
.wbox .th .pl{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center}
@media (prefers-color-scheme: dark){ .wbox .th .pl{background:#E9EBF0;color:#12141C} }
.wbox .nm{padding:10px 12px 12px;font-weight:700;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:8px}
.wbox .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-left:auto}
.wbox.done{border-color:var(--ok)}
.wbox.done .ck{background:var(--ok);border-color:var(--ok)}
.lead{margin:8px 2px 0;color:var(--muted);font-size:17px}

/* footer action */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot .sec-b{width:62px;height:64px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.foot .pri{flex:1;height:64px;border-radius:18px;background:var(--accent);color:var(--onaccent);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
.foot .pri.ok{background:var(--ok);color:#fff}

/* timer */
.timer{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.97);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.timer .l{font-size:18px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:2px}
.ring{position:relative;width:240px;height:240px;margin:14px 0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;font-weight:800;font-variant-numeric:tabular-nums}
.timer .nx{font-size:19px;font-weight:600;opacity:.9}
.timer .btns{display:flex;gap:12px;margin-top:26px}
.timer button{background:#fff;color:#111;font-weight:800;padding:16px 26px;border-radius:16px;font-size:18px}
.timer button.g{background:rgba(255,255,255,.12);color:#fff}

/* celebration */
.cele{text-align:center;padding-top:calc(60px + env(safe-area-inset-top))}
.cele .big{width:120px;height:120px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.cele h2{font-size:32px;font-weight:800;margin:24px 0 6px;letter-spacing:-.6px}
.cele p{color:var(--muted);margin:0}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 0}
.nums div{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.nums strong{display:block;font-size:30px;font-weight:800}
.nums small{color:var(--muted);font-weight:600;font-size:14px}
.nextup{margin-top:10px;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:left}
.nextup .dot{width:14px;height:14px;border-radius:50%}
.nextup small{display:block;color:var(--faint);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.nextup b{font-size:18px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:22px;font-weight:800}
.sheet .tipline{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.sheet .tipline b{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;flex:none}
.sheet .close{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--accent);color:var(--onaccent);font-weight:800;font-size:18px}

/* library */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;margin:16px 0 0;box-shadow:var(--shadow)}
.search input{flex:1;font:inherit;border:0;outline:0;background:none;color:var(--ink);padding:15px 0}
.search svg{color:var(--faint)}
.lib .row .th{width:64px;height:64px}
.lib .row .sub{color:var(--muted);font-size:15px;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;background:var(--ok);color:#fff;
  padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.2);white-space:nowrap}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>

<script>
/* ================= dates & cycle ================= */
// Days are dates ("2026-11-14"). Workout for a date: plan.cycle (repeats, skipping restDays) or plan.week (by weekday).
const WD = ["sun","mon","tue","wed","thu","fri","sat"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
const fmt = (s,o) => fromIso(s).toLocaleDateString("en-IN",o);
const todayKey = () => iso(new Date());

function workoutKeyFor(day){
  const c = P.cycle;
  if(c?.order?.length && isIso(c.start)){
    const rest = c.restDays || [];
    const isRest = s => rest.includes(WD[fromIso(s).getDay()]);
    if(isRest(day)) return "rest";
    // count training days between start and this day
    let n = 0;
    if(day >= c.start){ for(let s=c.start; s<day; s=addDays(s,1)) if(!isRest(s)) n++; }
    else { for(let s=day; s<c.start; s=addDays(s,1)) if(!isRest(s)) n--; }
    const L = c.order.length; return c.order[((n % L) + L) % L];
  }
  return P.week?.[WD[fromIso(day).getDay()]];
}
const workoutFor = day => P.workouts[workoutKeyFor(day)] || P.workouts.rest || {name:"Rest Day",warmup:[],main:[],cooldown:[]};
function nextTraining(day){ for(let i=1;i<10;i++){ const d=addDays(day,i), w=workoutFor(d); if((w.main||[]).length) return {d,w}; } return null; }

/* ================= icons ================= */
const sv = (p,s=22,sw=2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  play:(s=24,c="#12141C")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`,
  check:(s=18,c="#fff")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  back:()=>sv('<path d="M15 18l-6-6 6-6"/>',24,2.5),
  next:()=>sv('<path d="M9 6l6 6-6 6"/>',22,2.5),
  x:()=>sv('<path d="M6 6l12 12M18 6L6 18"/>',22,2.5),
  info:()=>sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>',22),
  home:()=>sv('<path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',26,2),
  grid:()=>sv('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',26,2),
  dumb:()=>sv('<path d="M7 12h10M4 8.5v7M7 6.5v11M17 6.5v11M20 8.5v7"/>',18),
  clock:()=>sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',18),
  target:()=>sv('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',20),
  book:()=>sv('<path d="M5 4.5h10a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10"/>',22),

/* ================= state ================= */
let P = null, timerInt = null;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const prog = () => store.get("prog:"+todayKey(), {});
const setProg = p => store.set("prog:"+todayKey(), p);
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app = () => document.getElementById("app");

/* ================= load plan ================= */
async function load(){
  const cached = store.get("plan", null);
  if(cached && !P){ P = cached; route(); }
  try{
    const r = await fetch("plan.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const fresh = await r.json();
    const changed = cached && JSON.stringify(cached) !== JSON.stringify(fresh);
    P = fresh; store.set("plan", fresh);
    if(!cached || changed) route();
    if(changed) toast("Your plan was updated");
  }catch(e){
    if(!P) $app().innerHTML = '<div class="empty">Please turn on the internet and open the app again.</div>';
  }
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent="✓  "+t; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); }

/* ================= workout helpers ================= */
const ytId = u => { if(!u) return null; const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u)?u:null); };
// list thumbnails: the short demo animation if there is one, else the YouTube still
const thumb = ex => { if(ex?.demo) return ex.demo; const id=ytId(ex?.video); return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : ""; };
const setsOf = it => (it.warmupSets||0) + (it.sets||1);
const k = (sec,i) => sec+"/"+i;
function doneCount(sec,i){ return (prog()[k(sec,i)]||[]).filter(Boolean).length; }
function nextOpen(arr,total){ for(let x=0;x<total;x++) if(!arr[x]) return x; return -1; }
function isDone(sec,i,it){ return doneCount(sec,i) >= setsOf(it); }
// steps of a guided workout: warm-up (one screen), each main exercise, each finisher, then done
function stepsOf(w){
  const s = [];
  if((w.warmup||[]).length) s.push({sec:"warmup"});
  (w.main||[]).forEach((it,i)=>s.push({sec:"main",i,it}));
  (w.cooldown||[]).forEach((it,i)=>s.push({sec:"cooldown",i,it}));
  return s;
}
function minutes(w){
  let s = (w.warmup||[]).length ? 300 : 0;
  (w.main||[]).forEach(it => s += setsOf(it)*(40+(it.rest||60)));
  (w.cooldown||[]).forEach(it => { const m=/(\d+)\s*min/.exec(it.time||""); s += m ? m[1]*60 : 120; });
  return Math.round(s/300)*5;
}
function progressPct(w){
  let t=0,d=0;
  (w.main||[]).forEach((it,i)=>{ t+=setsOf(it); d+=Math.min(doneCount("main",i),setsOf(it)); });
  (w.cooldown||[]).forEach((it,i)=>{ t+=1; d+=Math.min(doneCount("cooldown",i),1); });
  return t ? Math.round(d/t*100) : 0;
}
function firstOpenStep(w){
  const st = stepsOf(w);
  const warmTouched = (w.warmup||[]).some((_,i)=>doneCount("warmup",i));
  const anyMain = (w.main||[]).some((_,i)=>doneCount("main",i));
  for(let n=0;n<st.length;n++){
    const s = st[n];
    if(s.sec==="warmup"){ if(!warmTouched && !anyMain) return n; continue; }
    if(!isDone(s.sec,s.i,s.it)) return n;
  }
  return st.length; // all done
}

/* ================= routing ================= */
window.addEventListener("hashchange", route);
const go = h => { location.hash = h; };
let selDay = null;
function route(){
  if(!P) return;
  stopTimer(); closeSheet();
  const [v,a,b] = decodeURIComponent(location.hash.slice(1)).split("/");
  if(v==="w" && isIso(a)) return renderStep(a, +b||0);
  if(v==="lib" && a) return renderLibEx(a);
  if(v==="lib") return renderLib();
  selDay = (v==="day" && isIso(a)) ? a : todayKey();
  renderHome();
}

/* ================= HOME ================= */
function renderHome(){
  const day = selDay, isToday = day===todayKey(), w = workoutFor(day);
  const nMain = (w.main||[]).length, pct = isToday ? progressPct(w) : 0;
  let h = `<div class="wrap">
    <div class="hd"><div><div class="date">${fmt(todayKey(),{weekday:"long",day:"numeric",month:"long"})}</div>

      <button class="icon-btn" onclick="openTips()" aria-label="How to train">${I.info()}</button></div>`;

  h += `<div class="days">` + [0,1,2,3,4,5,6].map(n=>{ const d = addDays(todayKey(),n);
    const ww = workoutFor(d);
    return `<button class="day ${d===day?"sel":""} ${n===0?"today":""}" onclick="buzz();go('day/${d}')" aria-label="${fmt(d,{weekday:"long"})}: ${esc(ww.name)}">
      <span class="d">${n===0?"Today":fmt(d,{weekday:"short"})}</span><span class="n">${fromIso(d).getDate()}</span>

  }).join("") + `</div>`;

  if(nMain){
    h += `<div class="tags">${String(w.focus||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div class="stats"><span>${I.dumb()} ${nMain} exercises</span><span>${I.clock()} ${minutes(w)} min</span></div>`;
    if(isToday){
      const st = stepsOf(w), open = firstOpenStep(w), started = pct>0 || (w.warmup||[]).some((_,i)=>doneCount("warmup",i));
      h += `<div class="bar"><i style="width:${pct}%"></i></div>
        <button class="start" onclick="buzz();go('w/${day}/${open>=st.length?st.length:open}')">
        ${open>=st.length ? `${I.check(22,"#1F9D57")} Done today` : started ? `${I.play(22)} Continue` : `${I.play(22)} Start Workout`}</button>`;
    }
  } else {
    const nx = nextTraining(day);
    h += `<div class="note">${esc(w.note||"Rest today.")}</div>
      ${nx ? `<div class="tags"><span>Next: ${esc(nx.w.name)} · ${fmt(nx.d,{weekday:"long"})}</span></div>` : ""}`;
  }
  h += `</div>`;

  if((w.warmup||[]).length){
    h += `<div class="sec"><h3>Warm-up</h3><small>Pick any · 5 min</small></div><div class="hscroll">` +
      w.warmup.map((it,i)=>{ const ex=P.exercises[it.ex]; if(!ex) return "";
        return `<button class="wcard ${isToday&&doneCount("warmup",i)?"done":""}" onclick="go('lib/${it.ex}')">
          <div class="th" style="background-image:url('${thumb(ex)}')"></div><div class="nm">${esc(ex.name)}</div>
          <span class="tick">${I.check(15)}</span></button>`; }).join("") + `</div>`;
  }
  const stp = stepsOf(w);
  if(nMain){
    h += `<div class="sec"><h3>Exercises</h3><small>Warm-up set + 3 × 12</small></div>`;
    w.main.forEach((it,i)=> h += rowHtml(day, stp.findIndex(s=>s.sec==="main"&&s.i===i), it, i+1, isToday ? doneCount("main",i) : 0));
  }
  if((w.cooldown||[]).length){
    h += `<div class="sec"><h3>Finish</h3></div>`;
    w.cooldown.forEach((it,i)=> h += rowHtml(day, stp.findIndex(s=>s.sec==="cooldown"&&s.i===i), it, null, isToday ? doneCount("cooldown",i) : 0));
  }
  h += `</div>` + tabs("home");
  $app().innerHTML = h;
}
function rowHtml(day, step, it, num, done){
  const ex = P.exercises[it.ex]; if(!ex) return "";
  const n = setsOf(it), complete = done >= n;
  const meta = it.sets
    ? `<span class="dots">${Array.from({length:n},(_,s)=>`<i class="${s<(it.warmupSets||0)?"w":""} ${s<done?"on":""}"></i>`).join("")}</span><span>${esc(it.reps)} reps</span>`
    : `<span>${I.clock()}</span><span>${esc(it.time||it.reps||"")}</span>`;
  return `<button class="row ${complete?"done":""}" onclick="buzz();go('w/${day}/${step}')">
    <div class="th" style="background-image:url('${thumb(ex)}')">${num?`<span class="num">${num}</span>`:""}</div>
    <div class="bd"><div class="nm">${esc(ex.name)}</div><div class="meta">${meta}</div></div>
    <span class="go">${complete ? I.check(22,"#1F9D57") : I.next()}</span></button>`;
}
function tabs(on){
  return `<nav class="tabs">
    <button class="${on==="home"?"on":""}" onclick="go('day/'+todayKey())">${I.home()}Today</button>
    <button class="${on==="lib"?"on":""}" onclick="go('lib')">${I.grid()}Exercises</button></nav>`;
}

/* ================= GUIDED STEP ================= */
function topBar(day, n, total){
  return `<div class="top"><button class="x" onclick="go('day/${day}')" aria-label="Close">${I.x()}</button>
    <div class="segs">${Array.from({length:total},(_,j)=>`<i class="${j<n?"on":j===n?"cur":""}"></i>`).join("")}</div>
    <span class="cnt">${Math.min(n+1,total)}/${total}</span></div>`;
}
function renderStep(day, n){
  const w = workoutFor(day), st = stepsOf(w), isToday = day===todayKey();
  if(!st.length) return go("day/"+day);
  if(n >= st.length) return isToday ? renderDone(day) : go("day/"+day);
  const s = st[n];
  let h = `<div class="screen">${topBar(day,n,st.length)}<div class="wrap">`;

  if(s.sec==="warmup"){
    h += `<div class="ttl"><h2>Warm-up</h2></div><p class="lead">Pick any 4–5. Tap a card when done.</p><div class="wgrid">` +
      w.warmup.map((it,i)=>{ const ex=P.exercises[it.ex]; if(!ex) return "";
        const d = isToday && doneCount("warmup",i);
        return `<div class="wbox ${d?"done":""}" ${isToday?`onclick="toggleWarm(${i},'${day}',${n})"`:""}>
          <div class="th" style="background-image:url('${thumb(ex)}')"><button class="pl" onclick="event.stopPropagation();go('lib/${it.ex}')" aria-label="Watch ${esc(ex.name)}">${I.play(14,"currentColor")}</button></div>
          <div class="nm"><span>${esc(ex.name)}</span>${isToday?`<span class="ck">${d?I.check(14):""}</span>`:""}</div></div>`; }).join("") + `</div>`;
    h += `</div></div>` + foot(day, n, null, `<button class="pri" onclick="buzz();go('w/${day}/${n+1}')">Start exercises ${I.next()}</button>`);
    $app().innerHTML = h; window.scrollTo(0,0); return;
  }

  const it = s.it, ex = P.exercises[it.ex] || {name:it.ex};
  const total = setsOf(it), done = isToday ? doneCount(s.sec,s.i) : 0, arr = isToday ? (prog()[k(s.sec,s.i)]||[]) : [];
  h += videoBlock(ex);
  h += `<div class="ttl"><h2>${esc(ex.name)}</h2>
    <div class="chips"><span class="chip">${esc(ex.part)}</span>${ex.equipment && ex.equipment!=="None" ? `<span class="chip">${I.tool()} ${esc(ex.equipment)}</span>` : ""}</div></div>`;
  if(ex.feel) h += `<div class="feel">${I.target()}<span>${esc(ex.feel)}</span></div>`;

  // tracker
  h += `<div class="trk">`;
  if(it.sets){
    const wu = it.warmupSets||0;
    h += `<div class="reps"><strong>${esc(it.reps)}</strong><span>reps</span></div>
      <div class="circles">${Array.from({length:total},(_,j)=>{
        const on = arr[j], isNext = isToday && j===nextOpen(arr,total) && !on;
        return `<button class="circ ${j<wu?"w":""} ${on?"on":""} ${isNext?"next":""}" ${isToday?`onclick="tapSet('${day}',${n},${j})"`:"disabled"}
          aria-label="${j<wu?"Warm-up set":"Set "+(j-wu+1)}">${on ? I.check(24) : (j<wu ? "W" : j-wu+1)}</button>`; }).join("")}</div>
      <div class="lbls">${Array.from({length:total},(_,j)=>`<span>${j<wu?"Warm-up":"Set "+(j-wu+1)}</span>`).join("")}</div>`;
    h += weightRow(it.ex);
  } else {
    h += `<div class="reps"><strong>${esc(it.time||it.reps||"")}</strong></div>
      <div class="circles"><button class="circ ${arr[0]?"on":"next"}" ${isToday?`onclick="tapSet('${day}',${n},0)"`:"disabled"} aria-label="Done">${arr[0]?I.check(24):I.check(24,"currentColor")}</button></div>`;
  }
  h += `</div>`;

  // how to (collapsed)
  if(ex.steps?.length){
    h += `<details class="acc"><summary>${I.book()} How to do it <span class="chev">${I.next()}</span></summary>
      <ol class="steps">${ex.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${ex.mistakes?.length ? `<div class="avoid"><b>Avoid</b>${ex.mistakes.map(x=>`<div>✕ ${esc(x)}</div>`).join("")}</div>` : ""}
      ${ex.tip ? `<p class="tip">💡 ${esc(ex.tip)}</p>` : ""}</details>`;
  }
  h += `</div></div>`;

  // one big action button
  let pri;
  const last = n === st.length-1;
  if(isToday && done < total){
    const j = nextOpen(arr,total);
    const lbl = !it.sets ? "Done" : j < (it.warmupSets||0) ? "Warm-up set done" : `Set ${j-(it.warmupSets||0)+1} done`;
    pri = `<button class="pri ok" onclick="tapSet('${day}',${n},${j})">${I.check(22)} ${lbl}</button>`;
  } else {
    pri = `<button class="pri" onclick="buzz();go('w/${day}/${n+1}')">${last ? (isToday ? "Finish workout" : "Back to plan") : "Next exercise"} ${I.next()}</button>`;
  }
  h += foot(day, n, null, pri);
  $app().innerHTML = h; window.scrollTo(0,0);
}
function foot(day, n, _, pri){
  return `<div class="foot"><div class="in">
    <button class="sec-b" onclick="buzz();${n>0?`go('w/${day}/${n-1}')`:`go('day/${day}')`}" aria-label="Back">${I.back()}</button>${pri}</div></div>`;
}
function toggleWarm(i, day, n){
  buzz(); const p = prog(), key = k("warmup",i); p[key] = p[key]?.[0] ? [] : [true]; setProg(p); renderStep(day, n);
}
function tapSet(day, n, j){
  buzz();
  const w = workoutFor(day), st = stepsOf(w), s = st[n], it = s.it, total = setsOf(it);
  const p = prog(), key = k(s.sec,s.i), arr = p[key] || [];
  arr[j] = !arr[j]; p[key] = arr; setProg(p);
  renderStep(day, n);
  if(!arr[j]) return;                       // un-ticked: no timer
  const done = arr.filter(Boolean).length;
  if(!it.sets){ setTimeout(()=>go(`w/${day}/${n+1}`), 350); return; }
  const allDone = done >= total, wu = it.warmupSets||0;
  const nextIdx = nextOpen(arr,total);
  const nextEx = st[n+1]?.it ? P.exercises[st[n+1].it.ex]?.name : null;
  const txt = allDone ? (nextEx ? "Next: " + nextEx : "Last one done!")
            : (nextIdx < wu ? "Next: Warm-up set" : `Next: Set ${nextIdx-wu+1} of ${it.sets}`) + (j < wu ? " — working weight" : "");
  const rest = j < wu ? Math.min(it.rest||60, 60) : (it.rest||60);
  startTimer(rest, txt, allDone ? `w/${day}/${n+1}` : null);
}

/* ================= DONE ================= */
function renderDone(day){
  const w = workoutFor(day), nx = nextTraining(day);
  let sets = 0; (w.main||[]).forEach((it,i)=> sets += Math.min(doneCount("main",i), setsOf(it)));
  $app().innerHTML = `<div class="screen"><div class="wrap cele">

    <h2>Great job${P.name ? ", "+esc(P.name) : ""}!</h2><p>${esc(w.name)} complete</p>

    ${nx ? `<div class="nextup"><span class="dot" style="background:${nx.w.color}"></span><div><small>Next · ${fmt(nx.d,{weekday:"long"})}</small><b>${esc(nx.w.name)}</b></div></div>` : ""}
  </div></div><div class="foot"><div class="in"><button class="pri" onclick="go('day/${day}')">Back to home</button></div></div>`;

/* ================= weight ================= */
const wlog = ex => store.get("w:"+ex, []);
function weightInfo(ex){ const L=wlog(ex), t=todayKey(); return { today:(L.find(e=>e.d===t)||{}).kg ?? null, prev:[...L].reverse().find(e=>e.d!==t) }; }
function weightRow(ex){
  const w = weightInfo(ex), shown = w.today ?? (w.prev ? w.prev.kg : 0);
  return `<div class="wt"><button onclick="setWeight('${ex}',-2.5)" aria-label="Less weight">−</button>
    <div class="v"><strong id="wkg">${shown}</strong> <span>kg</span>
    <small>${w.prev ? `Last time ${w.prev.kg} kg` : "Your weight"}</small></div>
    <button onclick="setWeight('${ex}',2.5)" aria-label="More weight">+</button></div>`;
}
function setWeight(ex, delta){
  buzz();
  const L = wlog(ex), t = todayKey(), info = weightInfo(ex);
  const kg = Math.max(0, Math.round(((info.today ?? (info.prev ? info.prev.kg : 0)) + delta)*10)/10);
  const i = L.findIndex(e=>e.d===t); if(i>=0) L[i].kg = kg; else L.push({d:t,kg});
  store.set("w:"+ex, L.slice(-40));
  const el = document.getElementById("wkg"); if(el) el.textContent = kg;
}

/* ================= timer ================= */
function startTimer(sec, nextTxt, nextHash){
  stopTimer();
  let left = sec, total = sec; const R = 110, C = 2*Math.PI*R;
  const el = document.createElement("div"); el.className="timer"; el.id="timer";
  el.innerHTML = `<div class="l">Rest</div>
    <div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="${R}" stroke="rgba(255,255,255,.12)" stroke-width="12" fill="none"/>
      <circle id="arc" cx="120" cy="120" r="${R}" stroke="#1F9D57" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" style="transition:stroke-dashoffset 1s linear"/></svg>
      <div class="n" id="tn">${left}</div></div>
    <div class="nx">${esc(nextTxt)}</div>
    <div class="btns"><button class="g" id="add15">+15 sec</button><button id="skip">Skip</button></div>`;
  document.body.appendChild(el);
  const paint = () => { document.getElementById("tn").textContent = left; document.getElementById("arc").style.strokeDashoffset = C*(1-left/total); };
  document.getElementById("add15").onclick = () => { buzz(); left += 15; total = Math.max(total,left); paint(); };
  document.getElementById("skip").onclick = () => { buzz(); endTimer(nextHash); };
  timerInt = setInterval(()=>{ left--; paint(); if(left<=0){ beep(); endTimer(nextHash); } }, 1000);
}
function endTimer(h){ stopTimer(); if(h) go(h); }
function stopTimer(){ clearInterval(timerInt); timerInt=null; const t=document.getElementById("timer"); if(t) t.remove(); }
function beep(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){}
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    [0,.35].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.4,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3); o.start(a.currentTime+t); o.stop(a.currentTime+t+.3); }); }catch(e){}
}

/* ================= video ================= */
function videoBlock(ex){
  const id = ytId(ex.video);
  if(ex.demo){
    // short looping illustration; full YouTube video stays one tap away
    return `<div class="demo"><img src="${esc(ex.demo)}" alt="${esc(ex.name)} demo" onerror="demoFail(this)"></div>
      <div class="vlinks">${ex.altDemo ? `<button class="alt" data-main="${esc(ex.demo)}" data-alt="${esc(ex.altDemo.url)}" data-l="${esc(ex.altDemo.label)}" onclick="swapDemo(this)">${I.play(13,"currentColor")} <span>${esc(ex.altDemo.label)}</span></button>` : "<span></span>"}
      ${id ? `<a class="yt" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">${I.play(13,"currentColor")} Full video</a>` : ""}</div>`;
  }
  if(!id) return "";
  const alt = ex.altVideo && ytId(ex.altVideo.url);
  return `<div class="video" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')" onclick="playVid(this,'${id}')"><div class="play"><b>${I.play(30)}</b></div></div>
    <div class="vlinks">${alt ? `<button class="alt" data-main="${id}" data-alt="${alt}" data-l="${esc(ex.altVideo.label)}" onclick="swapVid(this)">${I.play(13,"currentColor")} <span>${esc(ex.altVideo.label)}</span></button>` : "<span></span>"}
    <a class="yt" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">YouTube ${I.ext()}</a></div>`;
}
function swapDemo(btn){
  buzz();
  const on = btn.dataset.on === "1";
  btn.dataset.on = on ? "0" : "1";
  btn.querySelector("span").textContent = on ? btn.dataset.l : "Main version";
  btn.closest(".vlinks").previousElementSibling.querySelector("img").src = on ? btn.dataset.main : btn.dataset.alt;
}
function demoFail(img){ const box = img.parentElement; box.classList.add("off"); box.innerHTML = `<span>Demo not loading. Tap “Full video”.</span>`; }
function playVid(el,id){ el.onclick=null; buzz();
  el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Exercise video"></iframe>`; }
function swapVid(btn){
  buzz();
  const showingAlt = btn.dataset.on === "1", id = showingAlt ? btn.dataset.main : btn.dataset.alt;
  btn.dataset.on = showingAlt ? "0" : "1";
  btn.querySelector("span").textContent = showingAlt ? btn.dataset.l : "Back to main video";
  btn.parentElement.querySelector(".yt").href = "https://www.youtube.com/watch?v="+id;
  const v = btn.parentElement.previousElementSibling;
  v.style.backgroundImage = `url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')`;
  v.innerHTML = `<div class="play"><b>${I.play(30)}</b></div>`; v.onclick = () => playVid(v,id);
}

/* ================= LIBRARY ================= */
function renderLib(q=""){
  const groups = {};
  Object.keys(P.exercises).forEach(id=>{ const ex=P.exercises[id];
    if(q && ![ex.name,ex.part,ex.group].join(" ").toLowerCase().includes(q.toLowerCase())) return;
    (groups[ex.group||"Other"] ||= []).push(id); });
  let h = `<div class="wrap lib"><div class="hd"><div><div class="date">${Object.keys(P.exercises).length} exercises</div><h1>Exercises</h1></div></div>
    <label class="search">${I.search()}<input id="q" placeholder="Search" value="${esc(q)}" oninput="libSearch(this.value)"></label>`;
  if(!Object.keys(groups).length) h += `<div class="empty">Nothing found</div>`;
  Object.entries(groups).forEach(([g,ids])=>{
    h += `<div class="sec"><h3>${esc(g)}</h3><small>${ids.length}</small></div>` + ids.map(id=>{ const ex=P.exercises[id];
      return `<button class="row" onclick="go('lib/${id}')"><div class="th" style="background-image:url('${thumb(ex)}')"></div>
        <div class="bd"><div class="nm">${esc(ex.name)}</div><div class="sub">${esc(ex.part)}</div></div><span class="go">${I.next()}</span></button>`; }).join("");
  });
  $app().innerHTML = h + `</div>` + tabs("lib");
}
function libSearch(v){ renderLib(v); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(v.length,v.length); }
function renderLibEx(id){
  const ex = P.exercises[id]; if(!ex) return go("lib");
  $app().innerHTML = `<div class="screen" style="padding-bottom:40px"><div class="top"><button class="x" onclick="history.length>1?history.back():go('lib')" aria-label="Back">${I.back()}</button></div>
    <div class="wrap">${videoBlock(ex)}<div class="ttl"><h2>${esc(ex.name)}</h2>
    <div class="chips"><span class="chip">${esc(ex.part)}</span>${ex.equipment && ex.equipment!=="None" ? `<span class="chip">${I.tool()} ${esc(ex.equipment)}</span>` : ""}</div></div>
    ${ex.feel ? `<div class="feel">${I.target()}<span>${esc(ex.feel)}</span></div>` : ""}
    ${ex.steps?.length ? `<details class="acc" open><summary>${I.book()} How to do it <span class="chev">${I.next()}</span></summary>
      <ol class="steps">${ex.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${ex.mistakes?.length ? `<div class="avoid"><b>Avoid</b>${ex.mistakes.map(x=>`<div>✕ ${esc(x)}</div>`).join("")}</div>` : ""}
      ${ex.tip ? `<p class="tip">💡 ${esc(ex.tip)}</p>` : ""}</details>` : ""}</div></div>`;
  window.scrollTo(0,0);
}

/* ================= start ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && P) load(); });
load();
</script>
